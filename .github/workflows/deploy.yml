name: Deploy govor.app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Test
        run: go vet ./... && go test ./...
      - name: Build WebAssembly module
        run: GOOS=js GOARCH=wasm go build -trimpath -ldflags="-s -w" -o web/govor.wasm .
      - name: Copy Go WASM runtime
        # lib/wasm since Go 1.24, misc/wasm before that
        run: cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/ || cp "$(go env GOROOT)/misc/wasm/wasm_exec.js" web/
      - name: Cache-bust asset URLs
        # GitHub Pages serves with max-age=600; version the asset references
        # so a cached HTML/CSS/JS/WASM from different deploys never mix.
        run: |
          v="${GITHUB_SHA::8}"
          sed -i -e "s|href=\"style.css\"|href=\"style.css?v=$v\"|" \
                 -e "s|src=\"wasm_exec.js\"|src=\"wasm_exec.js?v=$v\"|" \
                 -e "s|src=\"app.js\"|src=\"app.js?v=$v\"|" web/index.html
          sed -i "s|fetch(\"govor.wasm\")|fetch(\"govor.wasm?v=$v\")|g" web/app.js
          # Strict check: every known asset reference must be versioned, per
          # file; a count drift means a reference was added or rephrased and
          # the sed patterns above need updating.
          [ "$(grep -c "?v=$v" web/index.html)" -eq 3 ]
          [ "$(grep -c "?v=$v" web/app.js)" -eq 2 ]
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
